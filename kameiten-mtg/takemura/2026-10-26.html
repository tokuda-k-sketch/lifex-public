      var html = await open(pass);
      try { if (document.getElementById('remember').checked) localStorage.setItem(KEY, pass); else localStorage.removeItem(KEY); } catch (x) {}
      show(html);
    } catch (x) {
      err.textContent = 'パスコードが違います。本部からお伝えしたパスコードをご確認ください。';
      go.disabled = false;
    }
  });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (x) {}
  if (saved) open(saved).then(show).catch(function () { try { localStorage.removeItem(KEY); } catch (x) {} });
})();
</script>
</body>
</html>
