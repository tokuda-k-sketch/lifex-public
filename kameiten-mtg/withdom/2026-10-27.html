    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(ENC.iv) }, key, bytes(ENC.ct));
    return new TextDecoder().decode(plain);
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  var f = document.getElementById('f'), p = document.getElementById('p'), err = document.getElementById('err'), go = document.getElementById('go');
  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    go.disabled = true; err.textContent = '';
    var pass = p.value.trim().toLowerCase();
    try {
      var html = await open(pass);
      try { if (document.getElementById('remember').checked) localStorage.setItem(KEY, pass); else localStorage.removeItem(KEY); } catch (x) {}
      show(html);
    } catch (x) {
      err.textContent = 'パスコードが違います。本部からお伝えしたパスコードをご確認ください。';
      go.disabled = false;
    }
  });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (x) {}
  if (saved) open(saved).then(show).catch(function () { try { localStorage.removeItem(KEY); } catch (x) {} });
})();
</script>
</body>
