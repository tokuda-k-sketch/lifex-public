      go.disabled = false;

  });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (x) {}
  if (saved) open(saved).then(show).catch(function () { try { localStorage.removeItem(KEY); } catch (x) {} });
})();
</script>
