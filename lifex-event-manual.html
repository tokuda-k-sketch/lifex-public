<!doctype html><html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFE X 加盟店マニュアル｜イベント・見学会の追加</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
html,body{background:#F4F6F6;}
body{margin:0 !important;width:auto !important;height:auto !important;}
.stage{display:flex;justify-content:center;padding:16px;}
.artboard{width:1123px;height:794px;background:var(--card);box-shadow:0 4px 24px rgba(49,49,49,.12);transform-origin:top center;}
@media(max-width:1155px){.artboard{transform:scale(calc((100vw - 32px)/1123));}
 .stage{height:calc(794px * (100vw - 32px)/1123 + 32px);align-items:flex-start;}}

    :root {
      --ink: #313131; --ink-mid: #6E767A; --ink-soft: #96A0A3;
      --line: #DDE3E4; --line-soft: #E9EDEE;
      --paper: #F4F6F6; --card: #FFFFFF;
      --teal: #416571; --coral: #CA5C61;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 1123px; height: 794px; background: var(--paper);
      color: var(--ink);
      font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--teal); }
    a:hover { color: var(--coral); }

    .page { width: 1123px; height: 794px; padding: 36px 44px 32px; display: flex; flex-direction: column; }

    /* --- ヘッダー --- */
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .head-l { display: flex; align-items: baseline; gap: 16px; }
    .num {
      font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-size: 38px; font-weight: 600; line-height: 1; color: var(--coral); letter-spacing: .01em;
    }
    .title {
      font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-size: 27px; font-weight: 600; line-height: 1.2; letter-spacing: .04em; margin: 0;
    }
    .brand { text-align: right; line-height: 1.5; }
    .brand-name { font-size: 13px; font-weight: 700; letter-spacing: .18em; color: var(--teal); }
    .brand-sub { font-size: 10px; letter-spacing: .16em; color: var(--ink-soft); }
    .rule { display: flex; margin: 14px 0 22px; height: 2px; }
    .rule-a { width: 72px; background: var(--coral); }
    .rule-b { flex-grow: 1; background: var(--line); height: 1px; align-self: center; }

    /* --- 本文 2カラム --- */
    .body { display: grid; grid-template-columns: 335px 1fr; gap: 32px; flex-grow: 1; min-height: 0; }
    .rail { display: flex; flex-direction: column; gap: 22px; }
    .label { font-size: 10px; font-weight: 700; letter-spacing: .22em; color: var(--coral); margin-bottom: 12px; }
    .label.mute { color: var(--ink-soft); }

    .steps { display: flex; flex-direction: column; gap: 11px; }
    .step { display: flex; gap: 11px; align-items: flex-start; }
    .badge {
      flex-shrink: 0; width: 23px; height: 23px; border-radius: 50%;
      background: var(--coral); color: #fff; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; margin-top: 1px;
      font-family: "Zen Kaku Gothic New", sans-serif;
    }
    .step-t { font-size: 16px; line-height: 1.5; letter-spacing: .01em; text-wrap: pretty; }
    .step-t em { font-style: normal; font-weight: 700; color: var(--teal); }

    .divider { height: 1px; background: var(--line-soft); }

    .thumb {
      width: 335px; height: 196px; overflow: hidden; background: #fff;
      border: 1px solid var(--line);
    }
    .thumb img { width: 100%; display: block; }
    .caption { font-size: 11px; line-height: 1.6; color: var(--ink-mid); margin-top: 9px; }

    /* --- スクリーンショット --- */
    .shot { position: relative; border: 1px solid var(--line); background: #fff;
            box-shadow: 0 2px 10px rgba(49,49,49,.07); align-self: flex-start; }
    .shot > img { width: 100%; display: block; }
    .hl { position: absolute; border: 2px solid var(--coral); background: rgba(202,92,97,.10);
          border-radius: 2px; }
    .pin {
      position: absolute; width: 25px; height: 25px; border-radius: 50%;
      background: var(--coral); color: #fff; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 5px rgba(49,49,49,.35); transform: translate(-50%, -50%);
    }
    .inset {
      position: absolute; background: #fff; border: 1px solid var(--line);
      box-shadow: 0 4px 14px rgba(49,49,49,.16); padding: 6px;
    }
    .inset img { width: 100%; display: block; }

    /* --- フッター --- */
    .foot { display: flex; justify-content: space-between; align-items: center;
            font-size: 10px; letter-spacing: .12em; color: var(--ink-soft); padding-top: 14px; }

</style></head>
