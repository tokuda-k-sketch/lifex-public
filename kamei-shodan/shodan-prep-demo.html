<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFEX 商談準備ブリーフィング</title>
<style>
  :root{
    --ink:#1b2530; --sub:#5c6c7d; --line:#dbe3ea; --panel:#f3f6f9; --bg:#eef2f6;
    --navy:#1e4e79; --navy-soft:#e8eff6; --blue:#3b82c4;
    --good:#2e7d6e; --goodbg:#e7f2ef;
    --warn:#b05c1f; --warnbg:#fdf3dd; --warnln:#ecd9a8;
    --wait:#8b949e; --waitbg:#eef1f3;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif; color:var(--ink);
    background:var(--bg); line-height:1.65; font-feature-settings:"palt"}
  .bar{position:sticky; top:0; z-index:10; background:#1a1f24; color:#fff; padding:13px 22px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .bar h1{font-size:15px; font-weight:800; letter-spacing:.01em}
  .bar .tag{font-size:10.5px; font-weight:700; color:#c9d3dc; background:#2a3037; border-radius:99px; padding:3px 10px}
  .bar .sp{margin-left:auto; font-size:12px; color:#8b949e}
  .wrap{width:min(880px,94vw); margin:26px auto 60px}

  /* ===== 一覧ビュー ===== */
  .list-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px}
  .list-head h2{font-size:19px; font-weight:800; color:var(--navy)}
  .list-head .cnt{font-size:12.5px; color:var(--sub)}
  .lead-row{background:#fff; border-radius:10px; box-shadow:0 2px 14px rgba(20,40,60,.08); padding:16px 20px;
    margin-bottom:11px; display:flex; align-items:center; gap:16px; text-decoration:none; color:inherit}
  .lead-row:hover{box-shadow:0 4px 18px rgba(20,40,60,.14)}
  .lead-main{flex:1; min-width:0}
  .lead-name{font-size:15px; font-weight:800; color:var(--ink)}
  .lead-meta{font-size:12px; color:var(--sub); margin-top:3px; display:flex; gap:10px; flex-wrap:wrap}
  .badge{font-size:11px; font-weight:800; border-radius:99px; padding:4px 12px; flex-shrink:0; white-space:nowrap}
  .badge.done{color:var(--good); background:var(--goodbg)}
  .badge.processing{color:var(--warn); background:var(--warnbg); border:1px solid var(--warnln)}
  .badge.pending{color:var(--wait); background:var(--waitbg)}
  .badge.error{color:#b3372b; background:#fbe9e7}

  /* ===== 個別ビュー ===== */
  .kh{background:#fff; border-radius:12px; box-shadow:0 2px 14px rgba(20,40,60,.09); padding:22px 26px; margin-bottom:18px}
  .kh .row1{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:8px}
  .kh .nm{font-size:22px; font-weight:800; color:var(--navy)}
  .kh .nm small{font-size:13px; color:var(--sub); font-weight:600; margin-left:6px}
  .kh .meta{font-size:12px; color:var(--sub); text-align:right}
  .chips{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px}
  .chip{font-size:11.5px; font-weight:700; background:var(--panel); border:1px solid var(--line); border-radius:99px; padding:4px 12px; color:var(--sub)}

  .sec{background:#fff; border-radius:12px; box-shadow:0 2px 14px rgba(20,40,60,.09); padding:20px 26px; margin-bottom:16px}
  .sec-h{display:flex; align-items:center; gap:9px; margin-bottom:14px}
  .sec-h .ico{width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; flex-shrink:0}
  .sec-h h3{font-size:14.5px; font-weight:800; color:var(--ink)}
  .sec-h .note{margin-left:auto; font-size:10.5px; font-weight:700; color:var(--warn); background:var(--warnbg); border:1px solid var(--warnln); border-radius:4px; padding:2px 9px}

  .ico.land{background:#2e7d6e} .ico.plan{background:var(--navy)} .ico.money{background:#3b82c4} .ico.talk{background:#8a5a00}
  .ico.guess{background:#8b6bb0}

  .sec.guess{border:2px dashed #c9b8dd; background:#faf8fc}
  .guess-banner{font-size:11.5px; font-weight:700; color:#6b4f96; background:#f1eaf8; border:1px solid #ddc9ee; border-radius:7px; padding:8px 12px; margin-bottom:12px}
  .guess-item{font-size:13px; line-height:1.75; color:var(--ink); padding:9px 0; border-bottom:1px dashed var(--line)}
  .guess-item:last-child{border-bottom:none}
  .guess-item b{color:#6b4f96}
  .guess-item.na{color:var(--sub); font-style:italic}

  .range{display:flex; align-items:baseline; gap:8px; margin-bottom:12px}
  .range .v{font-size:26px; font-weight:800; color:var(--navy); font-variant-numeric:tabular-nums}
  .range .u{font-size:13px; color:var(--sub); font-weight:700}
  .breakdown{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:6px}
  .bd-item{border:1px solid var(--line); border-radius:9px; padding:10px 12px}
  .bd-item .bl{font-size:11px; color:var(--sub); font-weight:700}
  .bd-item .bv{font-size:15.5px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; margin-top:2px}
  .finance-note{font-size:11.5px; color:var(--sub); background:var(--panel); border-radius:7px; padding:9px 12px; margin-top:12px}

  .task-list{display:flex; flex-direction:column; gap:8px}
  .task{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:9px; padding:10px 14px; text-decoration:none; color:var(--ink); font-size:13.5px; font-weight:700}
  .task:hover{border-color:var(--blue); background:var(--navy-soft)}
  .task .arrow{margin-left:auto; color:var(--blue); font-weight:800}
  .task-note{font-size:11.5px; color:var(--sub); margin-top:10px}

  .plan-text{font-size:13.5px; line-height:1.85; color:var(--ink); white-space:pre-line}

  .plan-card{border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px}
  .plan-card:last-child{margin-bottom:0}
  .plan-card .ph{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px}
  .plan-card .no{font-size:11px; font-weight:700; color:var(--sub); font-variant-numeric:tabular-nums}
  .plan-card .spec{font-size:14.5px; font-weight:800; color:var(--ink)}
  .plan-card .price{font-size:13px; font-weight:800; color:var(--navy); text-align:right}
  .plan-card .price small{font-size:11px; color:var(--sub); font-weight:600}
  .plan-card .tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
  .plan-card .tag{font-size:11px; font-weight:700; background:var(--panel); border:1px solid var(--line); border-radius:99px; padding:2px 10px; color:var(--sub)}
  .plan-card .reason{font-size:12.5px; color:var(--sub); line-height:1.7}
  .plan-card .reason b{color:var(--ink)}
  .plan-card .thumbs{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap}
  .plan-card .thumb{position:relative; width:110px; height:82px; border-radius:7px; overflow:hidden; border:1px solid var(--line); cursor:zoom-in; background:var(--panel)}
  .plan-card .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .plan-card .thumb .lbl{position:absolute; left:4px; bottom:3px; font-size:9.5px; font-weight:800; color:#fff; background:rgba(27,37,48,.72); border-radius:4px; padding:1px 6px}
  .plan-card .thumb.missing{display:flex; align-items:center; justify-content:center; font-size:10.5px; color:var(--sub); cursor:default; text-align:center; padding:6px}

  .lightbox{position:fixed; inset:0; background:rgba(20,25,32,.82); display:none; align-items:center; justify-content:center; z-index:100; padding:30px; cursor:zoom-out}
  .lightbox.on{display:flex}
  .lightbox img{max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.4)}

  .talk-card{border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:16px}
  .talk-card:last-child{margin-bottom:0}
  .talk-trig{padding:10px 16px; background:var(--navy-soft); font-size:12.5px; font-weight:800; color:var(--navy)}
  .talk-body{padding:14px 16px 16px}
  .talk-line{display:flex; gap:12px; padding:5px 0}
  .talk-line .who{flex:0 0 56px; font-size:11px; font-weight:800; padding-top:2px; text-align:right}
  .talk-line.agent .who{color:var(--navy)}
  .talk-line.customer .who{color:#a06a1f}
  .talk-line .txt{flex:1; font-size:13.5px; line-height:1.75; color:var(--ink)}
  .talk-line.customer .txt{color:#5c4a2e}
  .talk-line.direction{padding:1px 0 6px}
  .talk-line.direction .who{visibility:hidden}
  .talk-line.direction .txt{font-size:11.5px; color:var(--sub); font-style:italic}
  .talk-line.note{margin-top:8px}
  .talk-line.note .who{visibility:hidden}
  .talk-line.note .txt{background:var(--warnbg); border:1px solid var(--warnln); border-radius:8px; padding:9px 12px; color:var(--warn); font-weight:700; font-size:12px; line-height:1.6}

  .pending-box{border:2px dashed var(--warnln); background:var(--warnbg); border-radius:10px; padding:18px 20px; text-align:center; color:var(--warn); font-size:13px; font-weight:700}

  .err{width:min(880px,94vw); margin:40px auto; background:#fff; border-radius:10px; padding:24px; text-align:center; color:var(--sub)}
</style></head>
<body>
<div class="bar">
  <h1>LIFEX 商談準備ブリーフィング</h1>
  <span class="tag" id="modeTag">読み込み中…</span>
  <span class="sp" id="statusLine"></span>
</div>
<div class="wrap" id="app"></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightboxImg" src="" alt=""></div>

<script>
// ⚠️ セットアップ後、実際のGASウェブアプリURLに差し替えること
const GAS_URL = 'ここに新規GASプロジェクトのウェブアプリURLを入れる';

const params = new URLSearchParams(location.search);
const leadId = params.get('id');
const storeToken = params.get('s');

// ---- デモ用サンプルデータ（徳田さんの実テスト回答をもとに、ストーリー・トークポイントはクロが手動で作成。

const DEMO_LEAD = {

    { label: '学区・小中学校を確認する', url: 'https://www.google.com/maps/search/?api=1&query=%E5%AE%9D%E5%A1%9A%E5%B8%82+%E5%B0%8F%E5%AD%A6%E6%A0%A1' }
  ], note: '土地は取得済みですが、建て替え前提のため周辺環境の再確認用に生成しています。' },
  recommendedPlans: [
    { planNo: '30-63-S-22-017', floorType: '2階建て', tsubo: 30.04, ldk: '3LDK', priceLifex: 2110, priceLite: 1990, solar: '9.77kW', access: '南入り',
      features: ['書斎', 'バルコニー', 'パントリー', 'ウォークインクローゼット'],
      reason: 'LDKが2階にあり「2階リビング」の希望に合致。書斎・バルコニーの希望も両方満たす、3つの希望条件が最も揃うプラン。' },
    { planNo: '35-72-E-11-043', floorType: '2階建て', tsubo: 35.57, ldk: '4LDK', priceLifex: 2300, priceLite: 2180, solar: null, access: '東入り',
      features: ['ウォークインクローゼット', 'パントリー', 'シューズクローク', 'ファミリークローク'],
      reason: '希望部屋数「4LDK」に完全一致する唯一の2階建てプラン。収納系（WIC・パントリー・ファミリークローク）が充実しており「収納が少ない」というお悩みに直接応える。' },
    { planNo: '35-56-E-22-045', floorType: '2階建て', tsubo: 32.06, ldk: '3LDK', priceLifex: 2300, priceLite: 2180, solar: '8.37kW', access: '東入り',
      features: ['書斎', 'パントリー', 'ウォークインクローゼット', 'ファミリークローク'],
      reason: 'LDKが2階、書斎ありで希望に合致。太陽光8.37kW搭載で「防災」のきっかけにも訴求できる。' }
  ],
  recommendedPlansNote: 'LIFEXは規格住宅のため、実在する全87プランの中から選定（Gプランカタログより）。図面画像は未取得のため、来店時にタブレット等で実物を見せながらご案内ください。',
  advice: { talks: [
    { trigger: 'ℹ️ このデモについて', lines: [
      { speaker: 'note', text: '実際の商談準備では、このお客様が選んだ回答（悩み・検討他社・きっかけ等）に該当するシーンだけが表示されます。今回はプレイブックの動作確認のため、徳田様のテスト回答に無い「きっかけ」パターン（⑦〜⑩）も参考として全部並べています。' }
    ] },
    { trigger: '① お客様の悩み（収納が少ない・暑い・寒い）を受け止める', lines: [
      { speaker: 'agent', text: '今のお住まい、収納のことと、夏の暑さ・冬の寒さで、結構気になってらっしゃるんですね。' },
      { speaker: 'direction', text: '（うなづきながら、少し間を置く）' },
      { speaker: 'customer', text: 'そうなんです、収納は増やしたいし、光熱費も気になって…' },
      { speaker: 'agent', text: '収納も温度も、毎日のことだから積み重なりますもんね。' },
      { speaker: 'direction', text: '（1呼吸置いて）' },
      { speaker: 'agent', text: 'ちなみに"暖かい家"って会社によって言うことが結構違うんですが、何を基準に比べたらいいか、聞かれたことはありますか？' },
      { speaker: 'customer', text: 'いえ、あまり…' },
      { speaker: 'agent', text: '実は、カタログに書いてある数値よりも、実際に測った気密性（すき間の少なさ）で体感がだいぶ変わるんです。LIFEXはZEH仕様・防湿気密シート・オール樹脂ペアガラスを標準にしていて、そこを数字でお見せできます。収納については、今日お持ちしたおすすめプランで、土間収納やファミリークローゼットの配置を実際に見ていただきながらお話しした方がイメージが湧きやすいと思います。' },
      { speaker: 'note', text: '出典：鉄板トーク集「性能・暖かさ」／LIFEX標準仕様一覧' }
    ] },
    { trigger: '② 一条工務店を検討されている', lines: [
      { speaker: 'agent', text: '一条さんも見てらっしゃるんですね。良い会社ですよね。' },
      { speaker: 'direction', text: '（相手の言葉を待つ）' },
      { speaker: 'customer', text: '性能がいいって聞いて。' },
      { speaker: 'agent', text: '性能、大事なポイントですよね。' },
      { speaker: 'direction', text: '（1呼吸置いて）' },
      { speaker: 'agent', text: '一条さんは性能の評判が本当に高いので、そこは安心材料だと思います。逆に伺いたいんですが、総額の見えやすさや、標準で入ってる設備の充実度は、比べてみてどうでしたか？' },
      { speaker: 'direction', text: '（お客様の答えを待つ。急いで自分から答えを言わない）' },
      { speaker: 'agent', text: '（お客様がそこは気になる、と答えたら）そこなんです。LIFEXは性能面でも引けを取らない基準を満たした上で、トータルコスト・デザイン・標準装備まで含めて比べていただける会社です。今日、その4つの軸で比較できる資料もお持ちしたので、後ほど一緒に見ていきましょうか。' },

      { speaker: 'note', text: '出典：鉄板トーク集「競合：アイ工務店」' }
    ] },
    { trigger: '④ ヤマト住建を検討されている（要準備）', lines: [

      { speaker: 'direction', text: '（資料を示しながら）' },

// 画像は本番運用時、gplan-images/<プランNo>/ 配下に 1F.png・2F.png(2階建てのみ)・exterior.png を
// このHTMLと同じ場所に配置する想定（GitHub Pagesデプロイ時にフォルダごとコピー）。
// 読み込めない場合（デモ環境・未整備プラン）は自動でプレースホルダーに切り替わる。
function planThumbs_(p){
  const base = 'gplan-images/' + p.planNo + '/';
  const items = p.floorType === '2階建て'
    ? [['1F.png','1F'], ['2F.png','2F'], ['exterior.png','外観']]
    : [['1F.png','間取り'], ['exterior.png','外観']];
  return items.map(([file, label]) => {
    const src = base + file;
    return `<div class="thumb" onclick="openLightbox('${src}')">
      <img src="${src}" alt="${label}" onerror="this.closest('.thumb').classList.add('missing'); this.closest('.thumb').innerHTML='画像準備中'; this.closest('.thumb').onclick=null;">
      <span class="lbl">${label}</span>
    </div>`;
  }).join('');
}
function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('on');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('on');
}

function statusBadge(status){
  const map = { '完了':['done','準備完了'], '処理中':['processing','処理中'], '未処理':['pending','未処理'] };
  const [cls,label] = map[status] || ['error', status];
  return `<span class="badge ${cls}">${label}</span>`;
}

function renderList(leads, demo){
  document.getElementById('modeTag').textContent = demo ? 'デモ表示' : '店舗一覧';
  const app = document.getElementById('app');
  const rows = leads.map(l => `
    <a class="lead-row" href="?id=${l.token}">
      <div class="lead-main">
        <div class="lead-name">${l.customerName}</div>
        <div class="lead-meta"><span>${l.receivedAt}</span><span>${l.roomType || ''} ${l.floorType || ''}</span><span>検討他社：${l.competitors || '—'}</span></div>
      </div>
      ${statusBadge(l.status)}
    </a>`).join('');
  app.innerHTML = `
    <div class="list-head"><h2>${demo ? '（デモ）' : ''}来場予定のお客様</h2><span class="cnt">${leads.length}件</span></div>
    ${rows}
    ${demo ? '<div class="task-note" style="margin-top:14px">※これはサンプルデータです。GAS_URLの設定後、実際の来場予約データに切り替わります。</div>' : ''}
  `;
}

async function load(){
  const statusLine = document.getElementById('statusLine');
  const isConfigured = GAS_URL.startsWith('http');

  if (!isConfigured) {
    statusLine.textContent = 'デモモード（GAS未接続）';
    if (leadId) renderDetail(DEMO_LEAD, true);
    else renderList(DEMO_LIST, true);
    return;
  }

  try {
    const url = leadId ? `${GAS_URL}?id=${encodeURIComponent(leadId)}` : `${GAS_URL}?s=${encodeURIComponent(storeToken || '')}`;
    const res = await fetch(url, { redirect: 'follow' });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    statusLine.textContent = '';
    if (leadId) renderDetail(data.lead, false);
    else renderList(data.leads, false);
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="err">データを読み込めませんでした（${String(e.message || e)}）</div>`;
  }
}
load();
