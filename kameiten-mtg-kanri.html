<style>

  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink);

    border: 1px solid var(--line); border-radius: 6px; }
  input[type=password]:focus { outline: none; border-color: var(--navy); }
  .row { display: flex; align-items: center; gap: 6px; margin: 10px 0 14px; font-size: 13px; color: var(--sub); }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--navy); border: 0; border-radius: 6px; padding: 10px 22px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: #b4452a; font-size: 13px; min-height: 1.5em; margin-top: 8px; }

  function bytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  async function open(pass) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' },

    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(ENC.iv) }, key, bytes(ENC.ct));

  }

  var f = document.getElementById('f'), p = document.getElementById('p'), err = document.getElementById('err'), go = document.getElementById('go');

    e.preventDefault();
    go.disabled = true; err.textContent = '';
    var pass = p.value.trim().toLowerCase();
    try {
      var html = await open(pass);
      try { if (document.getElementById('remember').checked) localStorage.setItem(KEY, pass); else localStorage.removeItem(KEY); } catch (x) {}
      show(html);
    } catch (x) {
      err.textContent = 'パスコードが違います。本部からお伝えしたパスコードをご確認ください。';
      go.disabled = false;
    }
  });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (x) {}
  if (saved) open(saved).then(show).catch(function () { try { localStorage.removeItem(KEY); } catch (x) {} });
