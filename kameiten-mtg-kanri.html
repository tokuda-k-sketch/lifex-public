  .row { display: flex; align-items: center; gap: 6px; margin: 10px 0 14px; font-size: 13px; color: var(--sub); }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--navy); border: 0; border-radius: 6px; padding: 10px 22px; cursor: pointer; }
