  body { margin: 0; background: #fff; color: var(--ink);

  input[type=password] { width: 100%; font: inherit; font-size: 18px; letter-spacing: .1em; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 6px; }
  input[type=password]:focus { outline: none; border-color: var(--navy); }
  .row { display: flex; align-items: center; gap: 6px; margin: 10px 0 14px; font-size: 13px; color: var(--sub); }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--navy); border: 0; border-radius: 6px; padding: 10px 22px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: #b4452a; font-size: 13px; min-height: 1.5em; margin-top: 8px; }
  .back { display: inline-block; margin-top: 22px; font-size: 13px; }
</style>
